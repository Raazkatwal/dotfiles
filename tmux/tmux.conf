# --- Reload config quickly ---
unbind r
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# --- Default shell ---
set -g default-shell /bin/zsh
set -g default-command /bin/zsh

# --- Terminal & Mouse ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g allow-passthrough on
set-option -g set-clipboard on  # automatic copy to system clipboard (Tmux >=3.2)

set -g clock-mode-style 12

# --- Start window and pane indices from 1 ---
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# --- Keybindings for pane navigation (Vim style) ---
set-window-option -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R


# New window in current directory
bind-key c new-window -c "#{pane_current_path}"

# Split pane horizontally or vertically in current directory
bind-key % split-window -h -c "#{pane_current_path}"
bind-key \" split-window -v -c "#{pane_current_path}"

# --- Status bar position ---
set-option -g status-position top

# --- Window renaming ---
set-option -g allow-rename off
set-option -g automatic-rename off

# --- Catppuccin theme ---
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# --- Status bar format ---
set -g status-right-length 100
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session} #[fg=#{@thm_fg},bg=#{@thm_crust}] #I"
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -g window-status-current-format "#[fg=#{@thm_fg},bg=#{@thm_crust},bold] #W "
set -g window-status-format "#[fg=#{@thm_fg},bg=#{@thm_crust}] #W "
set-option -g status-style bg=default


# --- Vim-style navigation plugin ---
set -g @plugin 'christoomey/vim-tmux-navigator'

# --- Plugin manager ---
run '~/.tmux/plugins/tpm/tpm'

# Mouse selection in copy mode
bind-key -T copy-mode-vi MouseDrag1Pane send-keys -X begin-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection

# --- Copy & Paste Integration ---
# Copy selection to system clipboard (Linux: xclip/xsel, macOS: pbcopy/pbpaste)
# Copy in vi mode using y
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"
# Or for macOS:
# bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Use Enter in copy mode to copy selection
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -sel clip -i"
# macOS: replace with pbcopy as above

# --- Copy mode mouse scrolling ---
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down

bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# Paste from system clipboard
bind-key p run "tmux set-buffer \"$(xclip -o -selection clipboard)\"; tmux paste-buffer"
# macOS: replace with pbpaste

